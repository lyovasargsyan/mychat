spring.application.name=classchat

# The HTTP port. Use the environment variable PORT if it exists, otherwise 8080.
server.port=${PORT:8080}

# If the app runs behind a proxy that terminates HTTPS, trust the X-Forwarded-* headers.
# The WebSocket "same origin" check needs them to know the public address of the site.
server.forward-headers-strategy=framework

# Supply these values through the environment in development/deployment.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/classchat}
spring.datasource.username=${DATABASE_USERNAME:classchat}
spring.datasource.password=${DATABASE_PASSWORD:local-dev-only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

classchat.mail.host=${MAIL_HOST:}
classchat.mail.port=${MAIL_PORT:587}
classchat.mail.username=${MAIL_USERNAME:}
classchat.mail.password=${MAIL_PASSWORD:}
classchat.mail.from=${MAIL_FROM:}
classchat.mail.smtp-auth=${MAIL_SMTP_AUTH:true}
classchat.mail.starttls=${MAIL_SMTP_STARTTLS:true}
classchat.mail.connection-timeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
classchat.mail.read-timeout=${MAIL_SMTP_READ_TIMEOUT:5000}
classchat.mail.write-timeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}

classchat.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
classchat.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
classchat.push.subject=${VAPID_SUBJECT:mailto:admin@classchat.local}
