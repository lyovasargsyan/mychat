services:
  - type: web
    name: classchat-app
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: classchat-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: classchat-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: classchat-db
          property: password

databases:
  - name: classchat-db
    databaseName: classchat
    user: classchat
    plan: free
    region: frankfurt
    ipAllowList: []
